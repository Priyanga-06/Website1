<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Proficiency Level</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

  <div class="container text-center mt-5">

    <div class="progress mb-4" style="height: 8px;">
      <div class="progress-bar bg-success" style="width: 75%;"></div>
    </div>

    <img src="./transparent-background-with-a-chick-free-png.webp"
      alt="Duo Owl" height="80">
    <h4 class="my-4">How much <span id="languageName">this language</span> do you know?</h4>

    <div class="d-flex flex-column align-items-center gap-3">
      <button class="btn option-btn w-50 text-start">
        📶 I'm new to this language
      </button>
      <button class="btn option-btn w-50 text-start">
        📶 I know some common words
      </button>
      <button class="btn option-btn w-50 text-start">
        📶 I can have basic conversations
      </button>
      <button class="btn option-btn w-50 text-start">
        📶 I can talk about various topics
      </button>
      <button class="btn option-btn w-50 text-start">
        📶 I can discuss most topics in detail
      </button>
    </div>
    <button id="continueBtn" class="btn btn-secondary mt-4" disabled>Continue</button>
  </div>
  <script>
    const buttons = document.querySelectorAll('.option-btn');
    const continueBtn = document.getElementById('continueBtn');

    continueBtn.addEventListener('click', () => {
      window.location.href = 'practice.html';
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('btn-success'));
        btn.classList.add('btn-success');
        continueBtn.disabled = false;
      });
    });
  </script>
  </div>
</body>

</html>
