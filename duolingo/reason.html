<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Why are you learning?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

  <div class="container text-center mt-5">

    <div class="progress mb-4" style="height: 8px;">
      <div class="progress-bar bg-success" style="width: 55%;"></div>
    </div>

    <img src="./transparent-background-with-a-chick-free-png.webp" alt="Duo Owl" height="80">
    <h4 class="my-4">Why are you learning <span id="languageName">this language</span>?</h4>

    <div class="row row-cols-1 row-cols-md-2 g-3 justify-content-center">
      <div class="col"><button class="btn option-btn w-100">👨‍👩‍👧‍👦 Connect with people</button></div>
      <div class="col"><button class="btn option-btn w-100">🎉 Just for fun</button></div>
      <div class="col"><button class="btn option-btn w-100">✈️ Prepare for travel</button></div>
      <div class="col"><button class="btn option-btn w-100">🧠 Spend time productively</button></div>
      <div class="col"><button class="btn option-btn w-100">📚 Support my education</button></div>
      <div class="col"><button class="btn option-btn w-100">💼 Boost my career</button></div>
      <div class="col"><button class="btn option-btn w-100">💬 Other</button></div>
    </div>
    <button id="continueBtn" class="btn btn-secondary mt-4" disabled>Continue</button>
  </div>
<script>
  const buttons = document.querySelectorAll('.option-btn');
  const continueBtn = document.getElementById('continueBtn');

  continueBtn.addEventListener('click', () => {
    window.location.href = 'proficiency.html'; 
  });

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('btn-success'));
      btn.classList.add('btn-success');
      continueBtn.disabled = false;
    });
  });
</script>

</body>
</html>
