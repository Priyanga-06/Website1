<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Profile - LinguaZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .profile-card {
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      background: #ffffff;
      padding: 2rem;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0d6efd;
    }

    .badge-language {
      background-color: #e0f0ff;
      color: #0d6efd;
      margin-right: 8px;
    }
  </style>
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-light shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">LinguaZone</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Index</a></li>
        <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
        <li class="nav-item"><a class="nav-link" href="practice.html">Practice</a></li>
        <li class="nav-item"><a class="nav-link" href="progress.html">Progress</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold text-primary" href="profile.html">Profile</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="profile-card text-center">
          <img src="https://via.placeholder.com/120?text=👩‍💻" alt="Profile" class="profile-avatar mb-3" />
          <h4 class="fw-bold">Priya</h4>
          <p class="text-muted mb-4">Language Learner at LinguaZone</p>

          <div class="mb-3">
            <p><strong>🔥 Streak:</strong> 5 days</p>
            <p><strong>⭐ Total XP:</strong> 1200</p>
          </div>

          <div>
            <p><strong>🌐 Languages Learning:</strong></p>
            <span class="badge badge-language">Spanish</span>
            <span class="badge badge-language">French</span>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary me-2">Edit Profile</button>
            <button class="btn btn-outline-secondary">Settings</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
